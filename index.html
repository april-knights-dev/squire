<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<title>Squire</title>
<!--
  リダイレクトではなく全画面 iframe。
  リダイレクトすると URL 欄が GAS の長い /exec に書き換わり、社内で配れる URL に
  ならない。iframe にすることで URL 欄は https://april-knights-dev.github.io/squire/
  のまま固定される。GAS 側は setXFrameOptionsMode(ALLOWALL) が必要。

  地の色は DESIGN.md の --g0（暗色 #0B1B1F / 明色 #EDEFEC）。iframe の読み込み中に
  白が一瞬出ないようにするためだけに置く。文言・図は置かない（認証前の画面）。
-->
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0B1B1F; }
  @media (prefers-color-scheme: light) { html, body { background: #EDEFEC; } }
  #app { display: block; width: 100%; height: 100%; border: 0; }
  /* 開けなかったときの逃げ道。3秒後にだけ出す。既定では見えない */
  #fallback {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: none; padding: 10px 16px;
    font: 12px/1.4 -apple-system, "Helvetica Neue", "Hiragino Kaku Gothic ProN", sans-serif;
    color: #6E9298; background: #0F2226; border-top: 1px solid #24444A;
  }
  @media (prefers-color-scheme: light) {
    #fallback { color: #566561; background: #F7F8F6; border-top-color: #C2CCC6; }
  }
  #fallback a { color: inherit; }
</style>
</head>
<body>
<iframe id="app" title="Squire"
  src="https://script.google.com/a/macros/april-knights.com/s/AKfycbzq5WHCLRO9QUnwS9Whv4nW8kkt69FYvCtJDDb9dLVY16xrx5T7DuWtSfKxxqbv8umZqg/exec"
  allow="clipboard-write"></iframe>
<div id="fallback">表示されない場合は <a id="direct" href="#">こちら</a></div>
<script>
  // Google 未サインインだと accounts.google.com が枠内表示を拒否して真っ白になる。
  // 判定は cross-origin では取れないので、時間で逃げ道だけ出す。
  var f = document.getElementById('app');
  var d = document.getElementById('direct');
  d.href = f.src;
  var loaded = false;
  f.addEventListener('load', function () { loaded = true; });
  setTimeout(function () {
    if (!loaded) { document.getElementById('fallback').style.display = 'block'; }
  }, 3000);
</script>
</body>
</html>
