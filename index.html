<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<title>Squire｜エイプリルナイツ 案件・人材データベース</title>
<meta name="description" content="エイプリルナイツの営業メールから案件・人材情報を検索・集計する社内データベース">
<!--
  favicon は盾ロゴ（DESIGN.md §4.1b の唯一のパス）をそのまま SVG で埋める。
  ★ ここに置くのが正しい。GAS の sandbox iframe 内に <link rel="icon"> を置いても
    タブのアイコンは top-level document（このラッパ）が決めるので反映されない。
  色は --up の暗色版と明色版の中間 #4E9C82。タブの地が白でも暗くても見える。
-->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%22-6%20-6%20112%20135.4%22%3E%3Cpath%20d=%22M0%200H100V70.3C100%2078.3%2088.5%20100.3%2051.2%20123.4H48.8C11.5%20100.3%200%2078.3%200%2070.3Z%22%20fill=%22%234F957D%22/%3E%3C/svg%3E">
<!--
  リダイレクトではなく全画面 iframe。
  リダイレクトすると URL 欄が GAS の長い /exec に書き換わり、社内で配れる URL に
  ならない。iframe にすることで URL 欄は https://april-knights-dev.github.io/squire/
  のまま固定される。

  必要な条件が2つあり、どちらも欠けると真っ暗になる:
    1. GAS 側が setXFrameOptionsMode(ALLOWALL)
    2. この iframe に allow="storage-access" を委譲する
       ALLOWALL にすると GAS の sandbox は storage access をユーザー操作待ちにする。
       委譲しないと「クリックするまで何も出ない」画面になる（実測）

  既知の制約: GAS は sandbox の寸法を読み込み時の値で固定するため、
  ウィンドウを大きくすると余白が出る。読み直しで追従させようとすると GAS が
  応答しなくなるので入れていない。再読み込みで直る。

  地の色は DESIGN.md の --g0（暗色 #0B1B1F / 明色 #EDEFEC）。iframe の読み込み中に
  白が一瞬出ないようにするためだけに置く。文言・図は置かない（認証前の画面）。
-->
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0B1B1F; }
  @media (prefers-color-scheme: light) { html, body { background: #EDEFEC; } }
  #app { display: block; width: 100%; height: 100%; border: 0; }
  /* 開けなかったときの逃げ道。5秒後にだけ出す。既定では見えない */
  #fallback {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: none; padding: 10px 16px;
    font: 12px/1.4 -apple-system, "Helvetica Neue", "Hiragino Kaku Gothic ProN", sans-serif;
    color: #6E9298; background: #0F2226; border-top: 1px solid #24444A;
  }
  @media (prefers-color-scheme: light) {
    #fallback { color: #566561; background: #F7F8F6; border-top-color: #C2CCC6; }
  }
  #fallback a { color: inherit; }
</style>
</head>
<body>
<iframe id="app" title="Squire"
  src="https://script.google.com/a/macros/april-knights.com/s/AKfycbzq5WHCLRO9QUnwS9Whv4nW8kkt69FYvCtJDDb9dLVY16xrx5T7DuWtSfKxxqbv8umZqg/exec"
  allow="clipboard-write; storage-access"></iframe>
<div id="fallback">表示されない場合は <a id="direct" href="#">こちら</a></div>
<script>
  // Google 未サインインだと accounts.google.com が枠内表示を拒否して真っ白になる。
  // 判定は cross-origin では取れないので、時間で逃げ道だけ出す。
  var f = document.getElementById('app');
  var d = document.getElementById('direct');
  d.href = f.src;
  var loaded = false;
  f.addEventListener('load', function () { loaded = true; });
  setTimeout(function () {
    if (!loaded) { document.getElementById('fallback').style.display = 'block'; }
  }, 5000);
</script>
</body>
</html>
