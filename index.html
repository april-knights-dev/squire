<!--
  この URL は「社内で配る入口」。実体は Google Apps Script の Web アプリで、
  ここからリダイレクトする。GAS の deployment ID は固定してあるので、
  コードを更新してもこの URL とリダイレクト先はどちらも変わらない。

  2026-08-27: URL 欄を github.io のまま保つために全画面 iframe で包む案を実測したが、
  撤回した。理由は3つ。
    1. GAS を XFrameOptionsMode.ALLOWALL にすると sandbox が storage access を
       ユーザー操作待ちにし、クリックするまで画面が真っ暗になる
       （allow="storage-access" の委譲で一度は解決した）
    2. それでも cross-origin では認証 cookie が third-party 扱いになり、
       Chrome が iframe の応答を描画できず「壊れた画像」になる状態を再現した
    3. GAS は sandbox の寸法を読み込み時に固定するため、ウィンドウをリサイズすると
       画面が欠ける。追従させるには読み直しが必要で、繰り返すと GAS が応答しなくなる
  よって URL 欄はリダイレクト後の GAS の URL になる。配る URL はこちらのままでよい。

  地の色は DESIGN.md の --g0（暗色 #0B1B1F / 明色 #EDEFEC）。リダイレクトまでの一瞬に
  白が出ないようにするためだけに置く。文言・図は置かない（認証前の画面）。
-->
<meta http-equiv="refresh" content="0; url=https://script.google.com/a/macros/april-knights.com/s/AKfycbzq5WHCLRO9QUnwS9Whv4nW8kkt69FYvCtJDDb9dLVY16xrx5T7DuWtSfKxxqbv8umZqg/exec">

  @media (prefers-color-scheme: light) { html, body { background: #EDEFEC; } }
</style>
</head>
